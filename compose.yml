name: utt

services:
  uttdb:
    container_name: utt-db
    image: utt/database:local
    build:
      context: ./custom-db-docker-image
      args:
        CITYDB_IMAGE: 3dcitydb/3dcitydb-pg:5-alpine@sha256:d786d67bc0641cc11c8676c816c4b76da7a769bb47c3c446f67e1be9514010ec
    # Complete preload list for the pinned base image (no other preloads required).
    # Extend this list explicitly if another preload-dependent extension is added.
    # Background workers avoid scheduler passwords and authentication changes.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${UTTDB_POSTGRES_DB:-uttdb}
      - -c
      - cron.use_background_workers=on
      - -c
      - cron.enable_superuser_jobs=off
      - -c
      - cron.timezone=UTC
      - -c
      - cron.max_running_jobs=2
    restart: unless-stopped
    ports:
      - "${UTTDB_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${UTTDB_POSTGRES_DB:-uttdb}
      POSTGRES_USER: ${UTTDB_POSTGRES_USER:-citydb}
      POSTGRES_PASSWORD: ${UTTDB_POSTGRES_PASSWORD:-citydb}
      SRID: ${SRID:-25832}
      HEIGHT_EPSG: ${HEIGHT_EPSG:-}
      SRS_NAME: ${SRS_NAME:-urn:ogc:def:crs:EPSG::25832}
      POSTGIS_SFCGAL: "false"
    volumes:
      - ./uttdb/data:/var/lib/postgresql
      - ./uttdb/source-files:/source-files:ro
      - ./uttdb/init:/uttdb-init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    container_name: utt-pgadmin
    image: dpage/pgadmin4:9.19.0@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:?PGADMIN_PORT must be set in .env}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
